<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="720" viewBox="0 0 1080 720">
  <rect width="1080" height="720" fill="#fffdf8"/>
  <text x="40" y="42" font-family="Georgia, serif" font-size="22" fill="#1f2933">AD tuberculosis query</text>
  <text x="40" y="66" font-family="ui-monospace, monospace" font-size="13" fill="#52606d">fix A=0 and D=0, sum every other index, leave T open</text>
  <line data-wire="A" x1="208" y1="146" x2="292" y2="146" stroke="#1d4e89" stroke-width="3"/>
  <circle data-wire="S" cx="208" cy="322" r="6" fill="#2f7d4a"/>
  <circle data-wire="S" cx="250" cy="322" r="6" fill="#2f7d4a"/>
  <circle data-wire="S" cx="124" cy="466" r="6" fill="#2f7d4a"/>
  <path data-wire="S" d="M208 322 H250 M208 322 V466 H124" fill="none" stroke="#2f7d4a" stroke-width="3"/>
  <path data-wire="T" d="M376 110 V36 H626 V196" fill="none" stroke="#b42318" stroke-width="3"/>
  <path data-wire="L" d="M418 286 H480 V232 H542" fill="none" stroke="#7a3e9d" stroke-width="3"/>
  <path data-wire="B" d="M208 502 H542" fill="none" stroke="#b86e00" stroke-width="3"/>
  <path data-wire="E" d="M710 232 H748 V146 H760 M748 232 V502 H710" fill="none" stroke="#3d4c5c" stroke-width="3"/>
  <line data-wire="X" x1="928" y1="146" x2="968" y2="146" stroke="#52606d" stroke-width="3"/>
  <line data-wire="D" x1="626" y1="538" x2="626" y2="590" stroke="#0f6f8a" stroke-width="3"/>
  <g data-factor="p(A)" data-axes="0"><rect x="40" y="110" width="168" height="72" rx="8" fill="#f7f4ea" stroke="#1f2933" stroke-width="1.5"/><text x="52" y="140" font-family="Georgia, serif" font-size="18" fill="#1f2933">p(A)</text><text x="52" y="162" font-family="ui-monospace, monospace" font-size="13" fill="#52606d">axes A</text></g><g data-factor="p(T|A)" data-axes="1,0"><rect x="292" y="110" width="168" height="72" rx="8" fill="#f7f4ea" stroke="#1f2933" stroke-width="1.5"/><text x="304" y="140" font-family="Georgia, serif" font-size="18" fill="#1f2933">p(T|A)</text><text x="304" y="162" font-family="ui-monospace, monospace" font-size="13" fill="#52606d">axes T, A</text></g><g data-factor="p(S)" data-axes="2"><rect x="40" y="286" width="168" height="72" rx="8" fill="#f7f4ea" stroke="#1f2933" stroke-width="1.5"/><text x="52" y="316" font-family="Georgia, serif" font-size="18" fill="#1f2933">p(S)</text><text x="52" y="338" font-family="ui-monospace, monospace" font-size="13" fill="#52606d">axes S</text></g><g data-factor="p(L|S)" data-axes="3,2"><rect x="250" y="286" width="168" height="72" rx="8" fill="#f7f4ea" stroke="#1f2933" stroke-width="1.5"/><text x="262" y="316" font-family="Georgia, serif" font-size="18" fill="#1f2933">p(L|S)</text><text x="262" y="338" font-family="ui-monospace, monospace" font-size="13" fill="#52606d">axes L, S</text></g><g data-factor="p(B|S)" data-axes="4,2"><rect x="40" y="466" width="168" height="72" rx="8" fill="#f7f4ea" stroke="#1f2933" stroke-width="1.5"/><text x="52" y="496" font-family="Georgia, serif" font-size="18" fill="#1f2933">p(B|S)</text><text x="52" y="518" font-family="ui-monospace, monospace" font-size="13" fill="#52606d">axes B, S</text></g><g data-factor="p(E|T,L)" data-axes="5,3,1"><rect x="542" y="196" width="168" height="72" rx="8" fill="#f7f4ea" stroke="#1f2933" stroke-width="1.5"/><text x="554" y="226" font-family="Georgia, serif" font-size="18" fill="#1f2933">p(E|T,L)</text><text x="554" y="248" font-family="ui-monospace, monospace" font-size="13" fill="#52606d">axes E, L, T</text></g><g data-factor="p(X|E)" data-axes="6,5"><rect x="760" y="110" width="168" height="72" rx="8" fill="#f7f4ea" stroke="#1f2933" stroke-width="1.5"/><text x="772" y="140" font-family="Georgia, serif" font-size="18" fill="#1f2933">p(X|E)</text><text x="772" y="162" font-family="ui-monospace, monospace" font-size="13" fill="#52606d">axes X, E</text></g><g data-factor="p(D|E,B)" data-axes="7,5,4"><rect x="542" y="466" width="168" height="72" rx="8" fill="#f7f4ea" stroke="#1f2933" stroke-width="1.5"/><text x="554" y="496" font-family="Georgia, serif" font-size="18" fill="#1f2933">p(D|E,B)</text><text x="554" y="518" font-family="ui-monospace, monospace" font-size="13" fill="#52606d">axes D, E, B</text></g>
  <g data-open="T"><circle cx="376" cy="36" r="7" fill="#b42318"/><text x="392" y="28" font-family="ui-monospace, monospace" font-size="14" fill="#b42318">open T</text></g>
  <g data-fixed="A=0"><rect x="214" y="124" width="70" height="22" rx="4" fill="#1d4e89"/><text x="222" y="140" font-family="ui-monospace, monospace" font-size="12" fill="#fffdf8">(1, 0) A</text></g>
  <g data-fixed="D=0"><rect x="592" y="594" width="78" height="22" rx="4" fill="#0f6f8a"/><text x="600" y="610" font-family="ui-monospace, monospace" font-size="12" fill="#fffdf8">(1, 0) D</text></g>
  <g data-sum="X"><rect x="972" y="134" width="78" height="22" rx="4" fill="#52606d"/><text x="980" y="150" font-family="ui-monospace, monospace" font-size="12" fill="#fffdf8">(1, 1) X</text></g>
</svg>
